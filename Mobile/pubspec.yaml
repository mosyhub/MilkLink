name: milklink_mobile
description: "Pasig City Human Milk Bank Mobile Application for Donors and Mothers"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
   sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  image_picker: ^1.2.4
  mobile_scanner: ^7.4.3
  fl_chart: ^1.3.0
  pdf: ^3.13.1
  csv: ^8.0.0
  open_filex: ^5.0.0
  qr_flutter: ^4.1.0
  file_picker: ^13.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

